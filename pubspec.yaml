name: face_liveness_check
description: A customizable Flutter package for on-device real-time facial liveness detection using Google ML Kit and Camera. Features configurable challenges, localization, and guaranteed frontal photo capture.
version: 1.0.0
homepage: https://github.com/alaaqutishat/face_liveness_check
repository: https://github.com/alaaqutishat/face_liveness_check
issue_tracker: https://github.com/alaaqutishat/face_liveness_check/issues

topics:
  - liveness
  - face-detection
  - mlkit
  - camera
  - biometric

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.4
  google_mlkit_face_detection: ^0.13.2
  image: ^4.8.0
  image_picker: ^1.2.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/mobilefacenet.tflite
